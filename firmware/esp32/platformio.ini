; PlatformIO project configuration — IoT Water Filtration System, ESP32 firmware.
; https://docs.platformio.org/page/projectconf.html
;
; Target: ESP32-WROOM-32 on a generic "esp32dev" board definition.
; Final board revision and physical pin map are TBD (docs/HARDWARE_INTEGRATION.md §1).

[env:esp32dev]
; Platform version is pinned so every team member builds with the same
; toolchain and Arduino core. Bump deliberately, not implicitly.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Extra warnings for project sources only (not the Arduino core or libraries).
build_src_flags =
    -Wall
    -Wextra
