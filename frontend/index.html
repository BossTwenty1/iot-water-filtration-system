<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Representative monitoring console for the IoT Embedded Water Filtration System" />
    <meta name="theme-color" content="#f8f9ff" />
    <title>AquaSense · IoT Water Filtration</title>
    <script>
      // Match useTheme: explicit choice, then system preference, then light.
      let theme = null
      try {
        const saved = JSON.parse(localStorage.getItem('aquasense-theme') || 'null')
        if (saved === 'light' || saved === 'dark') theme = saved
      } catch {}
      if (theme === null) {
        try { theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' }
        catch { theme = 'light' }
      }
      document.documentElement.classList.toggle('dark', theme === 'dark')
      document.documentElement.style.colorScheme = theme
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
