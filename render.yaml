# Render Blueprint: backend API + dashboard for the two-board ESP32 setup.
# Usage and the values to fill in: docs/DEPLOYMENT.md.
#
# Every `sync: false` value is asked for once when the Blueprint is created
# and is never stored in this file. Never put a real key here.

services:
  # Express API that the ESP32 boards upload to and the dashboard reads from.
  - type: web
    name: safe-water-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Must equal API_DEVICE_KEY in firmware/esp32/FF/secrets.h on both boards.
      - key: DEVICE_INGEST_KEY
        sync: false
      # The dashboard's https URL (the static site below), no trailing slash.
      - key: CORS_ORIGIN
        sync: false
      - key: BACKGROUND_JOBS_ENABLED
        value: "false"
      - key: SSE_POLL_INTERVAL_MS
        value: "3000"
      # Provisional display-pairing window; the approved value is TBD
      # (docs/TWO_BOARD_SYNC_AND_MERGE.md).
      - key: TELEMETRY_PAIR_TOLERANCE_MS
        value: "30000"

  # React dashboard (static files).
  - type: web
    name: safe-water-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's https URL followed by /api/v1, e.g. https://<api-host>/api/v1
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Client-side routing: every path serves the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
